rules:
  rules:
  - name: falhas_autenticacao
    kind: fixed
    feature: n_auth_failures
    op: '>='
    value: 3
  - name: erro_permissao
    kind: fixed
    feature: n_permission_denied
    op: '>='
    value: 1
  - name: rajada
    kind: user_stat
    feature: n_commands
    stat: p99
    multiplier: 3
  - name: volume
    kind: user_stat
    feature: rows_returned_sum
    stat: max
    multiplier: 1
  - name: dml_volume
    kind: user_stat
    feature: rows_affected_sum
    stat: max
    multiplier: 1
  - name: hora_inedita
    kind: unseen_hour
sacla:
  reader:
    patterns:
    - '*.json'
    - '*.json.gz'
    - '*.jsonl'
    - '*.jsonl.gz'
    zone_offsets_min:
      UTC: 0
      GMT: 0
  events:
    client_backend_types:
    - client backend
    - not initialized
    ignore_users:
    - postgres
    partition_aliases:
    - pattern: ^payment_p\d{4}_\d{2}$
      table: payment
    auth_failure_states:
    - 28P01
    - '28000'
    permission_denied_states:
    - '42501'
  features:
    window_minutes: 5
    timezone: America/Sao_Paulo
    weekend_days:
    - 5
    - 6
    hour_smoothing: 1.0
    robust_scale_floor: 1.0
