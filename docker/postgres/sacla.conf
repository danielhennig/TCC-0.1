# SACLA — configuração de logs do PostgreSQL 18.
# Cada escolha está justificada, com links para a documentação, em docs/decisoes.md.

# --- Destino e arquivos -------------------------------------------------------
logging_collector = on                  # obrigatório para jsonlog
log_destination = 'jsonlog'
log_directory = '/var/log/postgresql/sacla'
log_filename = 'postgresql-%Y%m%d_%H%M%S.log'   # o sufixo .log vira .json
log_file_mode = 0644                    # o container `sacla` lê o volume em modo somente leitura
log_rotation_age = 0
log_rotation_size = 100MB
log_timezone = 'UTC'

# --- Conexões -------------------------------------------------------------------
# No PG 18 o parâmetro virou lista; 'on' equivale a estes três. Falhas de autenticação
# são registradas sempre, independentemente deste valor.
log_connections = 'receipt,authentication,authorization'
log_disconnections = on

# --- Comandos -------------------------------------------------------------------
# log_statement fica 'none': com ele ligado o texto do comando NÃO se repete na linha
# de duração. Assim cada comando concluído gera uma única linha "duration: ... statement: ...".
log_statement = 'none'
log_min_duration_statement = 0
log_min_error_statement = error         # comandos que falham saem no campo "statement"
compute_query_id = on                   # preenche o campo query_id

# --- Linhas retornadas/afetadas (auto_explain) --------------------------------------
shared_preload_libraries = 'auto_explain'
auto_explain.log_min_duration = 0
auto_explain.log_analyze = on           # contagem real de linhas por nó do plano
auto_explain.log_timing = off           # sem cronometrar cada nó: reduz o overhead
auto_explain.log_buffers = off
auto_explain.log_format = 'json'
auto_explain.log_nested_statements = off
auto_explain.sample_rate = 1
auto_explain.log_level = 'LOG'
